[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

# /r/{글ID} — 크롤러(NotebookLM 등)가 읽을 수 있는 서버 렌더 글 페이지
[[redirects]]
  from = "/r/*"
  to = "/.netlify/functions/post/:splat"
  status = 200

# 카카오 로그인 백엔드 (무료·상시 — Render 의존 제거)
[[redirects]]
  from = "/api/auth/kakao"
  to = "/.netlify/functions/kakao-auth"
  status = 200
